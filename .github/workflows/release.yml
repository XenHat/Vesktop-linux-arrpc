name: Release

on:
    push:
        branches:
            - main
        tags:
            - v*
    workflow_dispatch:
    workflow_run:
        workflows: ["test"] # Put the exact 'name:' of your first workflow here
        types:
            - completed

jobs:
    on-success:
        # Crucial step: This ensures it only runs if the first workflow succeeded, not failed
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Run dependent tasks
              run: echo "The primary workflow passed. Running release..."
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                # os: [macos-latest, ubuntu-latest, windows-latest]
                os: [ubuntu-latest]
                include:
                    # - os: macos-latest
                    # platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    # - os: windows-latest
                    # platform: windows

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Check if release exists
              id: check-release
              if: ${{ matrix.platform != 'mac' }}
              run: |
                  TAG=${{ github.ref }}
                  TAG=${TAG#refs/tags/}
                  curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${TAG}" \
                      -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                      > /tmp/release-check.json
                  if grep -q '"tag_name"' /tmp/release-check.json; then
                      echo "Release already exists, skipping publish"
                      exit 0
                  fi

            - name: Package and upload (Win/Lin)
              if: ${{ matrix.platform != 'mac' }}
              run: |
                  pnpm electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run Electron Builder
              if: ${{ matrix.platform == 'mac' }}
              run: |
                  echo "$API_KEY" > apple.p8
                  pnpm electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
                  API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_KEY: apple.p8
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
